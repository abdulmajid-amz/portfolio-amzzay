<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>game</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: monospace;
    }

    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 2px solid #16213e;
      border-radius: 6px;
    }

    .controls {
      display: flex;
      gap: 10px;
    }

    button {
      background: #2ecc71;
      color: #1a1a2e;
      border: none;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: bold;
      font-family: inherit;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    button:hover { background: #56ef83; }
    button:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <div class="game-container">
    <canvas id="canvas"></canvas>
    <div class="controls">
      <button id="btnPlayPause">Play</button>
    </div>
  </div>

  <script>
    // ─── 1. PENGATURAN STATE & VARIABEL ───────────────────────────────
    var COLS = 20;
    var ROWS = 20;
    var FPS  = 9;
    var CELL; 

    var snake, dir, nextDir, food, score, best, phase, loopTimer;
    // phase bisa bernilai: 'idle', 'running', 'paused', 'dead'

    var canvas = document.getElementById('canvas');
    var ctx    = canvas.getContext('2d');

    var COLORS = {
      bg:        '#1a1a2e',
      grid:      '#16213e',
      snakeHead: '#56ef83',
      snakeBody: '#2ecc71',
      food:      '#e74c3c',
      text:      '#ffffff',
      dimText:   'rgba(255,255,255,0.5)',
      overlay:   'rgba(0,0,0,0.55)',
    };

    // ─── 2. LOGIKA PERMAINAN (GAME LOOP) ──────────────────────────────
    function init() {
      snake   = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir     = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score   = 0;
      placeFood();
    }

    function placeFood() {
      do {
        food = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      } while (snake.some(function(s) { return s.x === food.x && s.y === food.y; }));
    }

    function start() {
      if (loopTimer) clearInterval(loopTimer);
      init();
      phase = 'running';
      loopTimer = setInterval(tick, 1000 / FPS);
      updatePlayPauseButton();
    }

    function pause() {
      if (phase === 'running') {
        phase = 'paused';
        clearInterval(loopTimer);
        draw();
        updatePlayPauseButton();
      }
    }

    function resume() {
      if (phase === 'paused') {
        phase = 'running';
        loopTimer = setInterval(tick, 1000 / FPS);
        updatePlayPauseButton();
      }
    }

    function togglePlayPause() {
      if (phase === 'idle' || phase === 'dead') {
        start();
      } else if (phase === 'running') {
        pause();
      } else if (phase === 'paused') {
        resume();
      }
    }

    function updatePlayPauseButton() {
      var btn = document.getElementById('btnPlayPause');
      if (!btn) return;
      if (phase === 'running') {
        btn.innerText = 'Pause';
      } else if (phase === 'paused') {
        btn.innerText = 'Resume';
      } else {
        btn.innerText = 'Play';
      }
    }

    function tick() {
      dir = nextDir;

      var head = { 
        x: (snake[0].x + dir.x + COLS) % COLS,
        y: (snake[0].y + dir.y + ROWS) % ROWS 
      };

      // Deteksi tabrakan
      if (snake.some(function(s) { return s.x === head.x && s.y === head.y; })) {
        phase = 'dead';
        if (score > best) {
          best = score;
          localStorage.setItem('snake_best_score', best);
        }
        clearInterval(loopTimer);
        updatePlayPauseButton();
        draw();
        return;
      }

      snake.unshift(head);

      // Logika makan
      if (head.x === food.x && head.y === food.y) {
        score++;
        if (score > best) {
          best = score;
          localStorage.setItem('snake_best_score', best);
        }
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    // ─── 3. LOGIKA VISUAL (RENDER) ────────────────────────────────────
    function cell(x, y, color) {
      var pad = 1;
      ctx.fillStyle = color;
      ctx.fillRect(x * CELL + pad, y * CELL + pad, CELL - pad * 2, CELL - pad * 2);
    }

    function draw() {
      var W = canvas.width, H = canvas.height;

      ctx.fillStyle = COLORS.bg;
      ctx.fillRect(0, 0, W, H);

      // Gambar Grid
      ctx.strokeStyle = COLORS.grid;
      ctx.lineWidth = 0.5;
      for (var x = 0; x <= COLS; x++) {
        ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, H); ctx.stroke();
      }
      for (var y = 0; y <= ROWS; y++) {
        ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(W, y * CELL); ctx.stroke();
      }

      // Gambar Makanan
      ctx.fillStyle = COLORS.food;
      ctx.beginPath();
      ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Gambar Ular
      snake.forEach(function(s, i) {
        cell(s.x, s.y, i === 0 ? COLORS.snakeHead : COLORS.snakeBody);
      });

      // Render Teks (Skor & Highscore)
      var fontSize = Math.max(12, CELL * 0.8);
      ctx.font = 'bold ' + fontSize + 'px monospace';
      ctx.fillStyle = COLORS.dimText;
      ctx.textAlign = 'right';
      ctx.fillText(score, W - CELL * 0.5, CELL * 1.2);
      
      ctx.font = Math.max(10, CELL * 0.6) + 'px monospace';
      ctx.fillText('BEST ' + best, W - CELL * 0.5, CELL * 2.0);
      ctx.textAlign = 'left';

      // Render Layar Status
      if (phase === 'idle') {
        drawOverlay('SNAKE', 'tekan Play / arah panah untuk mulai');
      } else if (phase === 'paused') {
        drawOverlay('PAUSED', 'tekan Resume / spasi untuk lanjut');
      } else if (phase === 'dead') {
        drawOverlay('GAME OVER', 'skor ' + score + '  |  tertinggi ' + best);
      }
    }

    function drawOverlay(title, sub) {
      var W = canvas.width, H = canvas.height;
      var titleSize = Math.max(20, CELL * 1.6);
      var subSize   = Math.max(11, CELL * 0.65);

      ctx.fillStyle = COLORS.overlay;
      ctx.fillRect(0, 0, W, H);

      ctx.textAlign = 'center';
      ctx.font = 'bold ' + titleSize + 'px monospace';
      ctx.fillStyle = COLORS.text;
      ctx.fillText(title, W / 2, H / 2 - titleSize * 0.6);

      ctx.font = subSize + 'px monospace';
      ctx.fillStyle = COLORS.dimText;
      ctx.fillText(sub, W / 2, H / 2 + subSize * 1.4);
      ctx.textAlign = 'left';
    }

    function resize() {
      var size  = Math.min(window.innerWidth, window.innerHeight * 0.8);
      CELL      = Math.floor(size / COLS);
      var px    = CELL * COLS;
      canvas.width  = px;
      canvas.height = px;
      draw();
    }

    window.addEventListener('resize', resize);

    // ─── 4. LOGIKA INPUT (KEYBOARD & TOUCH) ───────────────────────────
    var KEY_MAP = { 37: 'left', 38: 'up', 39: 'right', 40: 'down' };

    // Input Tombol Play/Pause
    document.getElementById('btnPlayPause').addEventListener('click', togglePlayPause);

    // Input Keyboard
    document.addEventListener('keydown', function(e) {
      // Pause/Resume dengan Spasi (32) atau 'P' (80)
      if (e.keyCode === 32 || e.keyCode === 80) {
        e.preventDefault();
        togglePlayPause();
        return;
      }

      var action = KEY_MAP[e.keyCode];
      if (!action) return;
      e.preventDefault();

      if (phase === 'paused') {
        resume();
      } else if (phase !== 'running') { 
        start(); 
        return; 
      }

      if (action === 'left'  && dir.x === 0) nextDir = { x: -1, y:  0 };
      if (action === 'right' && dir.x === 0) nextDir = { x:  1, y:  0 };
      if (action === 'up'    && dir.y === 0) nextDir = { x:  0, y: -1 };
      if (action === 'down'  && dir.y === 0) nextDir = { x:  0, y:  1 };
    });

    // Input Swipe (Touchscreen)
    var touchStart = null;
    canvas.addEventListener('touchstart', function(e) {
      e.preventDefault();
      var t = e.touches[0];
      touchStart = { x: t.clientX, y: t.clientY };
    }, { passive: false });

    canvas.addEventListener('touchend', function(e) {
      e.preventDefault();
      if (!touchStart) return;

      var t  = e.changedTouches[0];
      var dx = t.clientX - touchStart.x;
      var dy = t.clientY - touchStart.y;
      touchStart = null;

      if (phase === 'paused') {
        resume();
      } else if (phase !== 'running') { 
        start(); 
        return; 
      }

      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;

      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 0 && dir.x === 0) nextDir = { x:  1, y: 0 };
        if (dx < 0 && dir.x === 0) nextDir = { x: -1, y: 0 };
      } else {
        if (dy > 0 && dir.y === 0) nextDir = { x: 0, y:  1 };
        if (dy < 0 && dir.y === 0) nextDir = { x: 0, y: -1 };
      }
    }, { passive: false });

    // ─── 5. MEMULAI GAME (BOOT) ───────────────────────────────────────
    best  = parseInt(localStorage.getItem('snake_best_score') || '0', 10);
    phase = 'idle';
    init();
    resize();

  </script>
</body>
</html>
